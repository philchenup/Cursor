<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HWI · CAM Splash Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --brand-blue: #0070d2;
    --brand-orange: #f39c12;
    --brand-red: #dc2626;
    --bg-0: #0a1018;
    --bg-1: #101a28;
    --bg-2: #152436;
    --text-muted: #8fa3b8;
    --text-status: #c5d4e3;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    background:
      radial-gradient(ellipse at 20% 30%, rgba(243,156,18,0.08), transparent 45%),
      radial-gradient(ellipse at 80% 70%, rgba(0,112,210,0.10), transparent 45%),
      #06090e;
    font-family: "Outfit", "Noto Sans SC", sans-serif;
    color: #e8eef5;
    padding: 40px 20px;
  }

  .page-title {
    position: fixed;
    top: 28px;
    left: 32px;
    font-size: 13px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #6b8299;
    font-weight: 500;
  }

  .splash {
    position: relative;
    width: min(1080px, 96vw);
    aspect-ratio: 1080 / 540;
    overflow: hidden;
    box-shadow:
      0 0 0 1px rgba(255, 255, 255, 0.07),
      0 40px 80px rgba(0, 0, 0, 0.55);
    background: linear-gradient(135deg, var(--bg-0), var(--bg-1) 50%, var(--bg-2));
    animation: splash-in 0.7s ease-out both;
  }

  .splash::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 28% 36%, rgba(243,156,18,0.16), transparent 42%),
      radial-gradient(circle at 72% 36%, rgba(0,112,210,0.22), transparent 44%);
    pointer-events: none;
  }

  .splash::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 24%;
    background: linear-gradient(to top, rgba(0,0,0,0.45), transparent);
    pointer-events: none;
  }

  .content {
    position: relative;
    z-index: 1;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 6.5% 7% 6%;
  }

  .logo-wrap {
    width: 80%;
    max-width: 860px;
    animation: logo-rise 0.9s 0.12s ease-out both;
  }

  .logo {
    width: 100%;
    height: auto;
    aspect-ratio: 1490 / 468;
    object-fit: contain;
    display: block;
    filter: drop-shadow(0 10px 28px rgba(0, 0, 0, 0.4));
  }

  .divider {
    width: 52%;
    height: 1.5px;
    margin: 2.4% 0 1.6%;
    background: linear-gradient(
      90deg,
      transparent,
      var(--brand-blue) 25%,
      var(--brand-orange) 50%,
      var(--brand-blue) 75%,
      transparent
    );
    opacity: 0.85;
    animation: fade-up 0.8s 0.3s ease-out both;
  }

  .version {
    font-size: clamp(12px, 1.35vw, 14px);
    letter-spacing: 0.32em;
    color: var(--text-muted);
    text-transform: uppercase;
    font-weight: 500;
    animation: fade-up 0.8s 0.38s ease-out both;
  }

  .footer {
    width: 63%;
    max-width: 680px;
    margin-top: auto;
    padding-top: 4%;
    animation: fade-up 0.8s 0.48s ease-out both;
  }

  .status-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 12px;
    gap: 16px;
  }

  .status {
    font-family: "Noto Sans SC", "Outfit", sans-serif;
    font-size: clamp(12px, 1.3vw, 14px);
    color: var(--text-status);
  }

  .percent {
    font-size: clamp(11px, 1.2vw, 13px);
    color: #4aa3e8;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .track {
    height: 7px;
    border-radius: 3px;
    background: rgba(255, 255, 255, 0.10);
    overflow: hidden;
  }

  .fill {
    height: 100%;
    width: 0%;
    border-radius: 3px;
    background: linear-gradient(90deg, #0070d2, #2b8fe0 55%, #f39c12);
    box-shadow: 0 0 14px rgba(0, 112, 210, 0.35);
    animation: progress 4.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
  }

  @keyframes progress {
    0%   { width: 0%; }
    18%  { width: 22%; }
    40%  { width: 48%; }
    65%  { width: 72%; }
    85%  { width: 90%; }
    100% { width: 100%; }
  }

  @keyframes splash-in {
    from { opacity: 0; transform: scale(0.97) translateY(12px); }
    to   { opacity: 1; transform: none; }
  }

  @keyframes logo-rise {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: none; }
  }

  @keyframes fade-up {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: none; }
  }

  .hint {
    margin-top: 28px;
    font-size: 12px;
    color: #5a6f85;
    text-align: center;
    line-height: 1.7;
    max-width: 560px;
  }

  .hint code {
    color: #8fa3b8;
    background: rgba(255,255,255,0.05);
    padding: 2px 6px;
    border-radius: 3px;
    font-size: 11px;
  }

  .swatches {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-top: 14px;
  }

  .swatch {
    width: 18px; height: 18px;
    border-radius: 3px;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.15);
  }
</style>
</head>
<body>
  <div class="page-title">HWI · CAM · Splash · 1080×540</div>

  <div>
    <div class="splash">
      <div class="content">
        <div class="logo-wrap">
          <img class="logo" src="../icon/preview.png" alt="CAM HWI 哈焊" />
        </div>

        <div class="divider"></div>
        <div class="version">Version 1.0.0</div>

        <div class="footer">
          <div class="status-row">
            <span class="status" id="status">初始化 UI 界面...</span>
            <span class="percent" id="percent">0%</span>
          </div>
          <div class="track"><div class="fill"></div></div>
        </div>
      </div>
    </div>

    <p class="hint">
      Logo <code>1490×468</code> 透明 PNG · 画布 <code>1080×540</code> · 最大宽 <code>860</code><br/>
      品牌色对齐 Logo：蓝 / 橙 / 红，无重复 HWI 大标题
    </p>
    <div class="swatches">
      <div class="swatch" style="background:#0070d2" title="Blue"></div>
      <div class="swatch" style="background:#f39c12" title="Orange"></div>
      <div class="swatch" style="background:#dc2626" title="Red"></div>
      <div class="swatch" style="background:#0a1018" title="Bg"></div>
    </div>
  </div>

<script>
  const stages = [
    [0,  "初始化 UI 界面..."],
    [15, "初始化仿真引擎..."],
    [35, "加载场景模型..."],
    [55, "准备渲染资源..."],
    [80, "正在启动用户界面..."],
    [95, "即将完成，请稍候..."],
  ];
  const statusEl = document.getElementById("status");
  const percentEl = document.getElementById("percent");
  let t0 = performance.now();
  const duration = 4200;

  function tick(now) {
    const p = Math.min(1, (now - t0) / duration);
    const eased = p < 0.5 ? 2*p*p : 1 - Math.pow(-2*p+2, 2)/2;
    const value = Math.round(eased * 100);
    percentEl.textContent = value + "%";
    let label = stages[0][1];
    for (const [th, text] of stages) if (value >= th) label = text;
    statusEl.textContent = label;
    if (p < 1) requestAnimationFrame(tick);
    else setTimeout(() => { t0 = performance.now(); requestAnimationFrame(tick); }, 600);
  }
  requestAnimationFrame(tick);
</script>
</body>
</html>
