<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HWI Splash Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg-deep: #0c1520;
    --bg-mid: #152536;
    --bg-end: #1e3a55;
    --accent: #4aa3e8;
    --accent-soft: #5eb3f5;
    --text-muted: #9aafc4;
    --text-status: #c5d4e3;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    background:
      radial-gradient(ellipse at 30% 20%, #1a2838 0%, transparent 50%),
      radial-gradient(ellipse at 70% 80%, #121c28 0%, transparent 45%),
      #070b10;
    font-family: "Outfit", "Noto Sans SC", sans-serif;
    color: #e8eef5;
    padding: 40px 20px;
  }

  .page-title {
    position: fixed;
    top: 28px;
    left: 32px;
    font-size: 13px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #6b8299;
    font-weight: 500;
  }

  .splash {
    position: relative;
    width: min(1000px, 96vw);
    aspect-ratio: 1000 / 560;
    border-radius: 2px;
    overflow: hidden;
    box-shadow:
      0 0 0 1px rgba(255, 255, 255, 0.08),
      0 40px 80px rgba(0, 0, 0, 0.55);
    background: linear-gradient(135deg, var(--bg-deep) 0%, var(--bg-mid) 45%, var(--bg-end) 100%);
    animation: splash-in 0.7s ease-out both;
  }

  .splash::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(
      circle at 50% 38%,
      rgba(61, 155, 233, 0.22) 0%,
      rgba(61, 155, 233, 0.07) 40%,
      transparent 70%
    );
    pointer-events: none;
  }

  .splash::after {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 16%;
    background: linear-gradient(to bottom, rgba(255, 255, 255, 0.07), transparent);
    pointer-events: none;
  }

  .content {
    position: relative;
    z-index: 1;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 8.5% 8% 7%;
  }

  .logo-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 72%;
    max-width: 720px;
    animation: logo-rise 0.9s 0.15s ease-out both;
  }

  .logo {
    width: 100%;
    height: auto;
    aspect-ratio: 1490 / 468;
    object-fit: contain;
    filter: drop-shadow(0 8px 24px rgba(0, 0, 0, 0.35));
  }

  /* 无真实 logo 时的矢量占位（比例同 1490x468） */
  .logo-fallback {
    width: 100%;
    aspect-ratio: 1490 / 468;
    display: grid;
    place-items: center;
    position: relative;
  }

  .logo-fallback svg {
    width: 78%;
    height: auto;
  }

  .divider {
    width: 44%;
    height: 1px;
    margin: 1.2% 0 2.2%;
    background: linear-gradient(
      90deg,
      transparent,
      rgba(94, 179, 245, 0.55),
      transparent
    );
    animation: fade-up 0.8s 0.35s ease-out both;
  }

  .version {
    font-size: clamp(12px, 1.5vw, 15px);
    letter-spacing: 0.28em;
    color: var(--text-muted);
    text-transform: uppercase;
    font-weight: 500;
    animation: fade-up 0.8s 0.4s ease-out both;
  }

  .footer {
    width: 64%;
    max-width: 640px;
    margin-top: auto;
    padding-top: 6%;
    animation: fade-up 0.8s 0.5s ease-out both;
  }

  .status-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 14px;
    gap: 16px;
  }

  .status {
    font-family: "Noto Sans SC", "Outfit", sans-serif;
    font-size: clamp(12px, 1.4vw, 14px);
    color: var(--text-status);
    font-weight: 400;
  }

  .percent {
    font-size: clamp(11px, 1.3vw, 13px);
    color: var(--accent-soft);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.04em;
  }

  .track {
    height: 6px;
    border-radius: 3px;
    background: rgba(255, 255, 255, 0.11);
    overflow: hidden;
  }

  .fill {
    height: 100%;
    width: 0%;
    border-radius: 3px;
    background: linear-gradient(90deg, #2b7fc7, #4aa3e8, #7ec8ff);
    box-shadow: 0 0 12px rgba(74, 163, 232, 0.45);
    animation: progress 4.2s cubic-bezier(0.4, 0.0, 0.2, 1) infinite;
  }

  @keyframes progress {
    0%   { width: 0%; }
    18%  { width: 22%; }
    40%  { width: 48%; }
    65%  { width: 72%; }
    85%  { width: 90%; }
    100% { width: 100%; }
  }

  @keyframes splash-in {
    from { opacity: 0; transform: scale(0.97) translateY(12px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }

  @keyframes logo-rise {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes fade-up {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .hint {
    margin-top: 28px;
    font-size: 12px;
    color: #5a6f85;
    letter-spacing: 0.04em;
    text-align: center;
    max-width: 520px;
    line-height: 1.6;
  }

  .hint code {
    color: #8fa3b8;
    background: rgba(255, 255, 255, 0.05);
    padding: 2px 6px;
    border-radius: 3px;
    font-size: 11px;
  }
</style>
</head>
<body>
  <div class="page-title">HWI · Splash Preview · 1000×560</div>

  <div>
    <div class="splash" id="splash">
      <div class="content">
        <div class="logo-wrap">
          <!-- 将真实 logo 放到 ../icon/preview.png 后会自动显示；否则用矢量占位 -->
          <img class="logo" id="logo" src="../icon/preview.png" alt="HWI Logo"
               onerror="this.style.display='none'; document.getElementById('fallback').style.display='grid';" />
          <div class="logo-fallback" id="fallback" style="display:none;">
            <svg viewBox="0 0 1490 468" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="HWI">
              <text x="745" y="290" text-anchor="middle"
                    font-family="Outfit, sans-serif" font-size="220" font-weight="700"
                    fill="#e8eef5" letter-spacing="24">HWI</text>
              <rect x="420" y="340" width="650" height="3" fill="url(#g)" opacity="0.7"/>
              <defs>
                <linearGradient id="g" x1="420" y1="0" x2="1070" y2="0">
                  <stop stop-color="#4aa3e8" stop-opacity="0"/>
                  <stop offset="0.5" stop-color="#4aa3e8"/>
                  <stop offset="1" stop-color="#4aa3e8" stop-opacity="0"/>
                </linearGradient>
              </defs>
            </svg>
          </div>
        </div>

        <div class="divider"></div>
        <div class="version">Version 1.0.0</div>

        <div class="footer">
          <div class="status-row">
            <span class="status" id="status">初始化 UI 界面...</span>
            <span class="percent" id="percent">0%</span>
          </div>
          <div class="track"><div class="fill" id="fill"></div></div>
        </div>
      </div>
    </div>

    <p class="hint">
      画布 <code>1000×560</code> · Logo 最大宽 <code>720</code>（保持 1490×468）·
      将透明 PNG 放到 <code>icon/preview.png</code> 即可替换占位
    </p>
  </div>

<script>
  const stages = [
    [0,  "初始化 UI 界面..."],
    [15, "初始化仿真引擎..."],
    [35, "加载场景模型..."],
    [55, "准备渲染资源..."],
    [80, "正在启动用户界面..."],
    [95, "即将完成，请稍候..."],
  ];

  const statusEl = document.getElementById("status");
  const percentEl = document.getElementById("percent");
  const fillEl = document.getElementById("fill");

  // 与 CSS 动画同步的百分比文案
  let t0 = performance.now();
  const duration = 4200;

  function tick(now) {
    const p = Math.min(1, (now - t0) / duration);
    // 匹配 CSS cubic 大致曲线
    const eased = p < 0.5
      ? 2 * p * p
      : 1 - Math.pow(-2 * p + 2, 2) / 2;
    const value = Math.round(eased * 100);

    percentEl.textContent = value + "%";
    // fill 由 CSS animation 驱动，这里只更新文案

    let label = stages[0][1];
    for (const [threshold, text] of stages) {
      if (value >= threshold) label = text;
    }
    statusEl.textContent = label;

    if (p < 1) {
      requestAnimationFrame(tick);
    } else {
      setTimeout(() => { t0 = performance.now(); requestAnimationFrame(tick); }, 600);
    }
  }
  requestAnimationFrame(tick);
</script>
</body>
</html>
